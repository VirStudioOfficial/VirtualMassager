<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast"></div>

  <section id="authView" class="auth-view">
    <div class="auth-card">
      <div class="logo">💬</div>
      <h1>My Messenger</h1>
      <p id="authSubtitle">وارد حساب خودت شو</p>

      <form id="authForm">
        <input id="username" type="text" placeholder="نام کاربری" minlength="3" maxlength="30" required>
        <input id="password" type="password" placeholder="رمز عبور" minlength="6" required>
        <button id="authButton" type="submit">ورود</button>
      </form>

      <button id="toggleAuth" class="link-button">حساب نداری؟ ثبت‌نام کن</button>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="me">
          <div class="avatar me-avatar" id="myAvatar"></div>
          <div>
            <strong id="myDisplayName"></strong>
            <small id="myUsername"></small>
          </div>
        </div>
        <button id="logoutButton" class="icon-button" title="خروج">↪</button>
      </header>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="userSearch" type="text" placeholder="جستجوی کاربر...">
      </div>
      <div id="searchResults" class="search-results"></div>
      <div id="chatList" class="chat-list"></div>
    </aside>

    <main class="chat-panel">
      <header id="chatHeader" class="chat-header">
        <button id="backButton" class="icon-button back-button hidden" title="بازگشت">→</button>
        <div class="avatar chat-header-avatar hidden" id="chatHeaderAvatar"></div>
        <div class="chat-header-info">
          <strong id="chatTitle">یک گفتگو انتخاب کن</strong>
          <small id="chatStatus"></small>
        </div>
      </header>

      <div id="messages" class="messages">
        <div class="empty-state">از سمت راست یک گفتگو انتخاب کن 👉</div>
      </div>

      <div id="attachmentPreview" class="attachment-preview hidden">
        <div class="attachment-preview-inner">
          <img id="attachmentPreviewImg" class="hidden" alt="پیش‌نمایش">
          <div id="attachmentPreviewFile" class="attachment-file-chip hidden">
            <span>📎</span>
            <span id="attachmentPreviewName"></span>
          </div>
          <button id="removeAttachment" type="button" class="icon-button">✕</button>
        </div>
      </div>

      <form id="messageForm" class="message-form hidden">
        <input id="fileInput" type="file" accept="image/*,.pdf,.zip,.rar,.txt,.doc,.docx" hidden>
        <button id="attachButton" type="button" class="icon-button" title="پیوست فایل">📎</button>
        <input id="messageInput" autocomplete="off" placeholder="پیامت رو بنویس...">
        <button id="sendButton" type="submit" class="send-button" title="ارسال">➤</button>
      </form>
    </main>
  </section>

  <div id="editModal" class="modal hidden">
    <div class="modal-card">
      <h3>ویرایش پیام</h3>
      <textarea id="editInput"></textarea>
      <div class="modal-actions">
        <button id="cancelEdit" type="button">لغو</button>
        <button id="saveEdit" type="button">ذخیره</button>
      </div>
    </div>
  </div>

  <div id="imageViewer" class="image-viewer hidden">
    <img id="imageViewerImg" alt="عکس">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>

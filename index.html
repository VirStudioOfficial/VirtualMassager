<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Messenger</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.setAttribute("data-theme", prefersLight ? "light" : "dark");
    })();
  </script>
</head>
<body>
  <div id="toast"></div>

  <!-- تا وقتی جاوااسکریپت مشخص کند کاربر لاگین است یا نه، این صفحه‌ی خنثی
       نشان داده می‌شود؛ نه فرم لاگین نه چت. بدون این، صفحه‌ی لاگین برای یک
       لحظه (حین چک شدن session) دیده می‌شد حتی برای کاربری که از قبل وارد
       شده بود، چون authView در HTML خام هیچ کلاس hidden نداشت. -->
  <section id="initialLoading" class="initial-loading">
    <div class="logo">💬</div>
  </section>

  <section id="authView" class="auth-view hidden">
    <div class="auth-card">
      <div class="logo">💬</div>
      <h1>Virtual Messenger</h1>
      <p id="authSubtitle">وارد حساب خودت شو</p>

      <form id="authForm">
        <input id="username" type="text" placeholder="نام کاربری" minlength="3" maxlength="30" required>
        <input id="password" type="password" placeholder="رمز عبور" minlength="6" required>
        <button id="authButton" type="submit">ورود</button>
      </form>

      <button id="toggleAuth" class="link-button">حساب نداری؟ ثبت‌نام کن</button>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="me" id="openSettings" title="تنظیمات پروفایل">
          <div class="avatar me-avatar" id="myAvatar"></div>
          <div>
            <strong id="myDisplayName"></strong>
            <small id="myUsername"></small>
          </div>
        </div>
        <div class="header-actions">
          <button id="archiveToggleButton" class="icon-button" title="آرشیو">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>
          </button>
          <button id="settingsButton" class="icon-button" title="تنظیمات">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.92 2.92l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V19.6a2.06 2.06 0 1 1-4.12 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.92-2.92l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H4.4a2.06 2.06 0 1 1 0-4.12h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.92-2.92l.06.06a1.7 1.7 0 0 0 1.87.34H10.5a1.7 1.7 0 0 0 1.03-1.56V4.4a2.06 2.06 0 1 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.92 2.92l-.06.06a1.7 1.7 0 0 0-.34 1.87V10.5a1.7 1.7 0 0 0 1.56 1.03h.09a2.06 2.06 0 1 1 0 4.12h-.09a1.7 1.7 0 0 0-1.56 1.03z"/></svg>
          </button>
          <button id="logoutButton" class="icon-button" title="خروج">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </header>

      <div id="archivedBanner" class="archived-banner hidden">
        <button id="backFromArchiveButton" class="icon-button" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
        <strong>آرشیو</strong>
      </div>

      <div class="search-box">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input id="userSearch" type="text" placeholder="جستجوی کاربر...">
      </div>
      <div id="searchResults" class="search-results"></div>
      <div id="chatList" class="chat-list"></div>
    </aside>

    <main class="chat-panel">
      <header id="chatHeader" class="chat-header">
        <button id="backButton" class="icon-button back-button hidden" title="بازگشت">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="avatar chat-header-avatar hidden" id="chatHeaderAvatar"></div>
        <div class="chat-header-info">
          <strong id="chatTitle">یک گفتگو انتخاب کن</strong>
          <small id="chatStatus"></small>
        </div>
        <div class="header-actions">
          <button id="voiceCallButton" class="icon-button hidden" title="تماس صوتی">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.8 2.1z"/></svg>
          </button>
          <button id="videoCallButton" class="icon-button hidden" title="تماس تصویری">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10.5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3.5l5 4v-11z"/></svg>
          </button>
        </div>
      </header>

      <div id="messages" class="messages">
        <div class="empty-state">از سمت راست یک گفتگو انتخاب کن 👉</div>
      </div>

      <div id="replyPreviewContainer" class="reply-preview-container hidden">
        <div class="reply-preview-content">
          <strong id="replyPreviewSender"></strong>
          <span id="replyPreviewText"></span>
        </div>
        <button id="cancelReplyBtn" class="icon-button" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>

      <div id="callModal" class="modal hidden">
        <div class="modal-card call-card">
          <div class="call-header">
            <h3 id="callTitle">تماس صوتی / تصویری</h3>
            <div id="callStatusBadge" class="call-status-badge hidden">در حال اتصال...</div>
          </div>
          <div id="callMonitor" class="call-monitor">
            <div>وضعیت: <strong id="connectionStatusText">در انتظار...</strong></div>
            <div>Ping: <strong id="callPing">-- ms</strong></div>
            <div>ICE: <strong id="iceStatus">--</strong></div>
            <div>WebRTC: <strong id="peerStatus">--</strong></div>
            <div>کیفیت: <strong id="callQuality">--</strong></div>
          </div>
          <div class="call-videos">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
          </div>
          <div class="call-actions">
            <button id="toggleMuteBtn" class="icon-button" type="button" title="قطع/وصل صدا">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            </button>
            <button id="toggleCamBtn" class="icon-button" type="button" title="قطع/وصل دوربین">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <button id="hangUpBtn" class="ghost-button danger-text" type="button">قطع تماس</button>
          </div>
        </div>
      </div>

      <div id="attachmentPreview" class="attachment-preview hidden">
        <div class="attachment-preview-inner">
          <img id="attachmentPreviewImg" class="hidden" alt="پیش‌نمایش">
          <video id="attachmentPreviewVideo" class="hidden" muted playsinline></video>
          <div id="attachmentPreviewFile" class="attachment-file-chip hidden">
            <span>📎</span>
            <span id="attachmentPreviewName"></span>
          </div>
          <span id="attachmentCompressNote" class="attachment-compress-note hidden"></span>
          <button id="removeAttachment" type="button" class="icon-button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <form id="messageForm" class="message-form hidden">
        <input id="fileInput" type="file" accept="image/*,video/*,.pdf,.zip,.rar,.txt,.doc,.docx" hidden>
        <button id="attachButton" type="button" class="icon-button" title="پیوست فایل یا ویدیو">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1 12.3 20.2a5.5 5.5 0 0 1-7.8-7.8L13.6 3.3a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 0 1-2.6-2.6l8.5-8.5"/></svg>
        </button>
        <input id="messageInput" autocomplete="off" placeholder="پیامت رو بنویس...">
        <button id="sendButton" type="submit" class="send-button" title="ارسال">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6 22 12 3.4 3.4 3 10l13 2-13 2z"/></svg>
        </button>
      </form>
    </main>
  </section>

  <div id="editModal" class="modal hidden">
    <div class="modal-card">
      <h3>ویرایش پیام</h3>
      <textarea id="editInput"></textarea>
      <div class="modal-actions">
        <button id="cancelEdit" type="button">لغو</button>
        <button id="saveEdit" type="button">ذخیره</button>
      </div>
    </div>
  </div>

  <div id="imageViewer" class="image-viewer hidden">
    <img id="imageViewerImg" alt="عکس">
    <video id="imageViewerVideo" class="hidden" controls playsinline></video>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card settings-card">
      <div class="settings-header">
        <h3>تنظیمات پروفایل</h3>
        <button id="closeSettings" class="icon-button" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="settings-avatar-row">
        <div class="avatar settings-avatar" id="settingsAvatarPreview"></div>
        <div class="settings-avatar-actions">
          <button id="uploadAvatarBtn" type="button" class="ghost-button">تغییر آواتار</button>
          <button id="removeAvatarBtn" type="button" class="ghost-button danger-text">حذف آواتار</button>
          <input id="avatarInput" type="file" accept="image/*" hidden>
        </div>
      </div>

      <label class="settings-label">نام نمایشی</label>
      <input id="settingsDisplayName" type="text" maxlength="30" placeholder="نام نمایشی">

      <label class="settings-label">وضعیت</label>
      <input id="settingsStatus" type="text" maxlength="40" placeholder="مثلاً: سرم شلوغه، بعداً جواب می‌دم">

      <label class="settings-label">بایو</label>
      <textarea id="settingsBio" maxlength="160" placeholder="چند خط درباره‌ی خودت..."></textarea>
      <small class="char-count"><span id="bioCharCount">0</span>/۱۶۰</small>

      <div class="settings-divider"></div>

      <label class="settings-label">تم ظاهری</label>
      <div class="theme-switch" id="themeSwitch">
        <button type="button" data-theme="light">☀️ روشن</button>
        <button type="button" data-theme="dark">🌙 تاریک</button>
        <button type="button" data-theme="system">🖥 سیستم</button>
      </div>

      <div class="settings-divider"></div>

      <label class="settings-label">تغییر رمز عبور</label>
      <input id="settingsNewPassword" type="password" placeholder="رمز عبور جدید (حداقل ۶ کاراکتر)" minlength="6" autocomplete="new-password">
      <input id="settingsConfirmPassword" type="password" placeholder="تکرار رمز عبور جدید" minlength="6" autocomplete="new-password">

      <div class="modal-actions">
        <button id="cancelSettings" type="button">لغو</button>
        <button id="saveSettings" type="button">ذخیره تغییرات</button>
      </div>
    </div>
  </div>

  <div id="incomingCallModal" class="modal hidden">
    <div class="modal-card call-card incoming-call-card">
      <div class="avatar settings-avatar" id="incomingCallAvatar" style="margin:0 auto 14px"></div>
      <h3 id="incomingCallTitle">تماس ورودی</h3>
      <p id="incomingCallSubtitle" class="incoming-call-subtitle"></p>
      <div class="call-actions">
        <button id="rejectCallBtn" class="ghost-button danger-text">رد تماس</button>
        <button id="acceptCallBtn" class="send-button" style="width:auto;border-radius:13px;padding:12px 24px;">پاسخ</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js" defer></script>
</body>
</html>

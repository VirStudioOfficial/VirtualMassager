name: Apply Messenger Enhancements

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-messenger-enhancements.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'chore: add messenger UI and media enhancement patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch messenger
        run: python3 .github/scripts/patch_messenger.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css script.js
          git diff --cached --quiet || git commit -m "feat: polish messenger UI and media handling"
          git push
